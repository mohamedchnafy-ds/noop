# TEMPORARY (fork, PR #175 head 4986c9f = #175 + main with #174, never merged): the two Apple legs of
# app-build on free Intel runners while the arm64 macos-15 / macos-26 runners are not acquiring jobs.
# Builds Strand (macOS) and runs StrandTests without the 14 PNG render classes (no GPU on Intel; none
# of them renders code these PRs change), and builds NOOPiOS for the simulator as the iOS leg does.
name: TMP Apple legs on Intel (fork, ci/intel-suggestions)

on:
  push:
    branches: ['ci/intel-suggestions']

concurrency:
  group: tmp-intel-suggestions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$X" || { echo "::error::no Xcode 26 on this image"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build Strand (macOS)
        run: >-
          set -o pipefail; xcodebuild -scheme Strand -configuration Debug -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee mac.log
      - name: StrandTests (without the PNG render classes)
        run: >-
          set -o pipefail; xcodebuild -scheme Strand -configuration Debug -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          -only-testing:StrandTests
          -skip-testing:StrandTests/CoachCardsRenderTests -skip-testing:StrandTests/DayWidgetsRenderTests
          -skip-testing:StrandTests/LabReportRenderTests -skip-testing:StrandTests/LiftProgramMuscleRenderTests
          -skip-testing:StrandTests/LiftProgressRenderTests -skip-testing:StrandTests/LiftSupersetRenderTests
          -skip-testing:StrandTests/LiquidVesselStillTests -skip-testing:StrandTests/LiveHRBannerRenderTests
          -skip-testing:StrandTests/LiveWorkoutRenderTests -skip-testing:StrandTests/MoreHubRenderTests
          -skip-testing:StrandTests/NutritionRenderTests -skip-testing:StrandTests/SleepScreenRenderTests
          -skip-testing:StrandTests/TodayScreenRenderTests -skip-testing:StrandTests/TrainingRenderTests
          test 2>&1 | tee test.log
      - name: Surface errors and the new suites' results as annotations
        if: always()
        run: |
          for f in mac.log test.log; do
            [ -f "$f" ] || continue
            grep -E "error:|Test Case .* failed|with [0-9]+ failures" "$f" | sort -u | head -60 | while IFS= read -r line; do
              echo "::error::$f: ${line:0:900}"
            done
          done
          if [ -f test.log ]; then
            for s in CoachDayPromptsTests DictationTextTests CoachPromptsTests; do
              p=$(grep -cE "Test Case '-\[StrandTests\.$s .*' passed" test.log || true)
              q=$(grep -cE "Test Case '-\[StrandTests\.$s .*' failed" test.log || true)
              echo "::notice::$s: $p passed, $q failed"
            done
            grep -E "Executed [0-9]+ tests" test.log | tail -1 | while IFS= read -r line; do echo "::notice::${line:0:900}"; done
          fi
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode 26 (iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$X" || { echo "::error::no Xcode 26 on this image"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build NOOPiOS (iOS Simulator, as app-build's iOS leg)
        run: >-
          set -o pipefail; xcodebuild -scheme NOOPiOS -configuration Debug -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee ios.log
      - name: Surface errors as annotations
        if: always()
        run: |
          [ -f ios.log ] || exit 0
          grep -E "error:" ios.log | sort -u | head -60 | while IFS= read -r line; do echo "::error::ios.log: ${line:0:900}"; done
