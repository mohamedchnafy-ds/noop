# Fork-only: render the guided superset screens, the Sleep tab, the Today screen and the Lift Log's
# Progression, the Nutrition screens and the More hub / Training screens to PNG whenever a `render/**` branch is pushed, and publish the images as a prerelease named
# after the branch — the visual check against the mockups before an .ipa is built. Runs the render test
# classes (LiftSupersetRenderTests, SleepScreenRenderTests, TodayScreenRenderTests, LiftProgressRenderTests)
# on the macOS app target; the screens are shared SwiftUI, drawn at iPhone size in dark mode, in French.
name: Screens render (fork, on push)

on:
  push:
    branches: ['render/**']

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    # Combined branch only (4 Nov.): the arm64 macOS pool is saturated. The Intel VM has no GPU (ImageRenderer
    # needs Metal), so it runs StrandTests without the render classes: the compile + unit-test check.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Render the screens
        env:
          TEST_RUNNER_NOOP_RENDER_DIR: ${{ runner.temp }}/render
        run: |
          set +e
          xcodebuild -scheme Strand -configuration Debug -destination 'platform=macOS' \
            -only-testing:StrandTests \
            -skip-testing:StrandTests/LiftSupersetRenderTests \
            -skip-testing:StrandTests/SleepScreenRenderTests \
            -skip-testing:StrandTests/TodayScreenRenderTests \
            -skip-testing:StrandTests/LiftProgressRenderTests \
            -skip-testing:StrandTests/NutritionRenderTests \
            -skip-testing:StrandTests/MoreHubRenderTests \
            -skip-testing:StrandTests/TrainingRenderTests \
            -skip-testing:StrandTests/LiveHRBannerRenderTests \
            -skip-testing:StrandTests/DayWidgetsRenderTests \
            -skip-testing:StrandTests/CoachCardsRenderTests \
            -skip-testing:StrandTests/LabReportRenderTests \
            -skip-testing:StrandTests/LiftProgramMuscleRenderTests \
            -skip-testing:StrandTests/LiveWorkoutRenderTests \
            -skip-testing:StrandTests/LiquidVesselStillTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test > xcodebuild.log 2>&1
          status=$?
          grep -E "failed|\*\* TEST|error:|Executed" xcodebuild.log | tail -60
          if [ $status -ne 0 ]; then
            # The job log is not readable from where the fork is worked on: failures go up as annotations.
            grep -E "error:|failed|XCTAssert" xcodebuild.log | head -40 | sed 's/^/::error::/'
            exit 1
          fi
      - name: Publish the images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la "$RUNNER_TEMP/render"
          TAG="render-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          sleep 3
          gh release create "$TAG" "$RUNNER_TEMP"/render/*.png --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" \
            --title "Screens · ${GITHUB_REF_NAME} · ${GITHUB_SHA:0:7}" \
            --notes "Rendered by LiftSupersetRenderTests, SleepScreenRenderTests and TodayScreenRenderTests at ${GITHUB_SHA:0:7}."
